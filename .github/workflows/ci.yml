name: CI

on: push

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - run: pip install --require-hashes -r requirements-dev.txt

      - run: pytest

  build-and-sbom:
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t supply-chain-app:${{ github.sha }} .

      - name: Generate SBOM with Syft
        uses: anchore/sbom-action@v0
        with:
          image: supply-chain-app:${{ github.sha }}
          format: cyclonedx-json
          output-file: sbom.json

      - name: Upload SBOM as artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.json

      - name: Install Grype
        run: curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh | sh -s -- -b /usr/local/bin

      - name: Update Grype vulnerability database
        run: grype db update

      - name: Scan image for vulnerabilities with Grype
        run: grype supply-chain-app:${{ github.sha }} --output json --file grype-results.json
        continue-on-error: true

      - name: Install Conftest
        run: |
          wget https://github.com/open-policy-agent/conftest/releases/download/v0.56.0/conftest_0.56.0_Linux_x86_64.tar.gz
          tar xzf conftest_0.56.0_Linux_x86_64.tar.gz
          sudo mv conftest /usr/local/bin

      - name: Evaluate vulnerability policy with OPA/Conftest
        run: conftest test grype-results.json --policy policy/vuln.rego --data policy/exceptions.json

      # Everything below only runs if the policy step above passed.
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image to GHCR
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker tag supply-chain-app:${{ github.sha }} "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:${{ github.sha }}"
          DIGEST_REF=$(docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE:${{ github.sha }}")
          echo "IMAGE_DIGEST_REF=$DIGEST_REF" >> "$GITHUB_ENV"

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign image by digest (keyless)
        run: cosign sign --yes "$IMAGE_DIGEST_REF"

      - name: Verify signature
        run: |
          cosign verify "$IMAGE_DIGEST_REF" \
            --certificate-identity-regexp '^https://github\.com/Essa-alalwan/secure-supply-chain-pipeline/\.github/workflows/ci\.yml@refs/.*' \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com